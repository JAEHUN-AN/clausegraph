# 포트는 이 워크스페이스의 다른 프로젝트와 겹치지 않게 잡았다.
# kograph-neo4j가 7474/7687, fleetdeck-db가 5432를 쓴다.
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: clausegraph-neo4j
    ports:
      - "7475:7474"   # HTTP 브라우저
      - "7688:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-clausegraph}
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $${NEO4J_PASSWORD:-clausegraph} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

volumes:
  neo4j-data:
