[project]
name = "clausegraph"
version = "0.1.0"
description = "Insurance clause knowledge graph + multi-agent claims adjudication assistant."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "requests>=2.32",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
]

[project.optional-dependencies]
graph = [
    "neo4j>=5.23",
]
rag = [
    "numpy>=2.0",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "sentence-transformers>=3.0",
]
onnx = [
    "onnxruntime>=1.19",
    "optimum[onnxruntime]>=1.23",
    "transformers>=4.40",
]
serve = [
    "onnxruntime>=1.19",
    "transformers>=4.40",
    "neo4j>=5.23",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "mcp>=1.1",
    "prometheus-client>=0.21",
]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6", "responses>=0.25"]
mcp = [
    "mcp>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clausegraph"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
